<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpertMarket — Sector Indices</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="category">
<div id="navbar-container"></div>
<div class="main">
<div id="ticker-container"></div>
<div class="page active" id="category">
  <div class="topbar"><h1 class="page-title">Sector Indices</h1></div>
  <div class="grid grid-3">
    <div class="cat-card"><div class="cat-icon">JP</div><div class="cat-name">Japanese Cuisine</div><div class="mono" style="font-size:18px;font-weight:700">£890.30</div><span class="badge badge-green">▲ 12.4%</span></div>
    <div class="cat-card"><div class="cat-icon">FD</div><div class="cat-name">Fine Dining</div><div class="mono" style="font-size:18px;font-weight:700">£1,204.00</div><span class="badge badge-green">▲ 8.1%</span></div>
    <div class="cat-card"><div class="cat-icon">IT</div><div class="cat-name">Italian</div><div class="mono" style="font-size:18px;font-weight:700">£445.60</div><span class="badge badge-green">▲ 5.7%</span></div>
  </div>
</div>
</div>
  <script src="navbar.js"></script>

<script>
(function initPage() {
  const id = document.body.dataset.page;
  const ticker = document.getElementById('ticker');
  if (ticker) ticker.style.display = id === 'landing' ? 'none' : 'block';

  const navMap = {
    landing: 0, dashboard: 1, profile: 2, stock: 3, category: 4,
    review: 5, ai: 6, portfolio: 7, ipo: 8, trust: 9
  };
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[navMap[id]]?.classList.add('active');
})();

function setTab(t) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById('tab-' + t)?.classList.add('active');
}

function togglePill(el) {
  el.classList.toggle('selected');
}
</script>
</body>
</html>
