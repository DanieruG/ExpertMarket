<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpertMarket — Join as Expert</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="ipo">
<div id="navbar-container"></div>
<div class="main">
<div id="ticker-container"></div>
<div class="page active" id="ipo">
  <div class="topbar"><h1 class="page-title">Join as an Expert</h1></div>
  <div class="grid grid-2">
    <div class="card">
      <div class="section-title" style="margin-bottom:16px">Expert Application Form</div>
      <div class="form-field"><label class="form-label">Full Name</label><input type="text" class="form-input" placeholder="Your professional name"></div>
      <div class="form-field"><label class="form-label">Specialist Area</label><select class="form-select"><option>Japanese Cuisine</option><option>Indian Cuisine</option><option>Fine Dining</option></select></div>
      <button class="btn btn-primary" style="width:100%;padding:14px">Submit IPO Application</button>
    </div>
    <div class="ai-block"><div class="ai-label"><div class="ai-dot"></div> AI Suggested Starting Price</div><div class="ai-text">Based on submitted credentials, suggested opening price is £45 to £80.</div></div>
  </div>
</div>
</div>
  <script src="navbar.js"></script>
<script>
(function initPage() {
  const id = document.body.dataset.page;
  const ticker = document.getElementById('ticker');
  if (ticker) ticker.style.display = id === 'landing' ? 'none' : 'block';

  const navMap = {
    landing: 0, dashboard: 1, profile: 2, stock: 3, category: 4,
    review: 5, ai: 6, portfolio: 7, ipo: 8, trust: 9
  };
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[navMap[id]]?.classList.add('active');
})();

function setTab(t) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById('tab-' + t)?.classList.add('active');
}

function togglePill(el) {
  el.classList.toggle('selected');
}
</script>
</body>
</html>
