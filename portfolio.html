<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpertMarket — My Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="portfolio">
<div id="navbar-container"></div>
<div class="main">
<div id="ticker-container"></div>
<div class="page active" id="portfolio">
  <div class="topbar"><h1 class="page-title">My Portfolio</h1></div>
  <div class="portfolio-summary">
    <div><div class="port-total">£2,450</div><div class="up" style="font-size:14px;margin-top:4px">▲ £142.30 (+6.2%) all time</div></div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:16px">Holdings</div>
    <table class="table"><thead><tr><th>Expert</th><th>Shares</th><th>Value</th><th>P&L</th></tr></thead><tbody><tr><td>Rajan Kumar</td><td class="mono">4</td><td class="mono">£844</td><td class="up mono">+£184</td></tr></tbody></table>
  </div>
</div>
</div>
  <script src="navbar.js"></script>
<script>
(function initPage() {
  const id = document.body.dataset.page;
  const ticker = document.getElementById('ticker');
  if (ticker) ticker.style.display = id === 'landing' ? 'none' : 'block';

  const navMap = {
    landing: 0, dashboard: 1, profile: 2, stock: 3, category: 4,
    review: 5, ai: 6, portfolio: 7, ipo: 8, trust: 9
  };
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[navMap[id]]?.classList.add('active');
})();

function setTab(t) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById('tab-' + t)?.classList.add('active');
}

function togglePill(el) {
  el.classList.toggle('selected');
}
</script>
</body>
</html>
