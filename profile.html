<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpertMarket — Expert Profile</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">
<div id="navbar-container"></div>
<div class="main">
<div id="ticker-container"></div>
<div class="page active" id="profile">
  <div class="topbar"><h1 class="page-title">Expert Profile</h1></div>
  <div class="profile-hero">
    <div class="profile-av-lg" id="expertAvatar">AK</div>
    <div style="flex:1">
      <h2 style="font-size:26px;font-weight:800;letter-spacing:-0.5px" id="expertName">Alex K.</h2>
      <div style="color:var(--muted);font-size:14px;margin-top:2px" id="expertIdentifier">Expert ID: alex.kitchen · London, UK</div>
      <div class="verified-badge">Verified Expert</div>
      <div style="color:var(--muted);font-size:13px;margin-top:10px;max-width:700px;" id="expertBio"></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap" id="expertTags"></div>
    </div>
  </div>

  <div class="grid grid-4" style="margin-bottom:20px;" id="expertStats"></div>

  <div class="grid grid-2" style="margin-bottom:20px;" id="investorPopularity"></div>

  <div class="grid grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="section-header"><div class="section-title">Investors</div></div>
      <table class="table">
        <thead>
          <tr><th>Investor</th><th>Units</th><th>Amount Invested</th></tr>
        </thead>
        <tbody id="investorsTable"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-header"><div class="section-title">Restaurant Reviews</div></div>
      <div id="verdictList"></div>
    </div>
  </div>
</div>
</div>

<div class="modal-backdrop" id="reviewModal" onclick="closeReviewModal(event)">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="card-title" style="margin-bottom:4px;">Restaurant Review</div>
        <div class="section-title" id="modalRestaurant">Dishoom</div>
      </div>
      <button class="icon-btn" onclick="closeReviewModal()">Close</button>
    </div>
    <div class="metric-row"><span class="text-muted">Verdict</span><span class="mono" id="modalVerdict">Recommend</span></div>
    <div class="metric-row"><span class="text-muted">Score</span><span class="mono" id="modalScore">91/100</span></div>
    <div class="divider" style="margin:12px 0;"></div>
    <div class="text-muted" style="font-size:13px;" id="modalComment"></div>
  </div>
</div>
<script src="navbar.js"></script>
<script>
let expertProfileData = null;
let activeReview = null;

function buildDefaultInvestors(expert) {
  const base = Number(expert.id || 1) * 3;
  return [
    { name: 'Maya Singh', units: 8 + base, amount: (8 + base) * 120 },
    { name: 'Liam Cooper', units: 5 + base, amount: (5 + base) * 120 },
    { name: 'Nina Patel', units: 11 + base, amount: (11 + base) * 120 },
    { name: 'Jonas Meyer', units: 6 + base, amount: (6 + base) * 120 }
  ];
}

function buildDefaultVerdicts(expert) {
  const cat1 = expert.categories?.[0] || 'Core';
  const cat2 = expert.categories?.[1] || 'Specialist';

  return [
    {
      restaurant: `${cat1} House`,
      verdict: 'Recommend',
      score: `${Math.max(80, Number(expert.confidence || 80))}/100`,
      comment: `Strong consistency signals in ${cat1.toLowerCase()}-focused venues with reliable repeat-customer feedback.`
    },
    {
      restaurant: `${cat2} Table`,
      verdict: expert.risk === 'High' ? 'Buy' : 'Hold',
      score: `${Math.max(76, Number(expert.confidence || 80) - 3)}/100`,
      comment: `Good sentiment momentum with improving quality signals across recent reviewer feedback.`
    },
    {
      restaurant: `${expert.city} Kitchen`,
      verdict: expert.risk === 'Low' ? 'Recommend' : 'Hold',
      score: `${Math.max(74, Number(expert.confidence || 80) - 6)}/100`,
      comment: `Solid operating profile with location-based relevance and stable service quality signals.`
    },
    {
      restaurant: `Urban ${cat1}`,
      verdict: 'Avoid',
      score: `${Math.max(68, Number(expert.confidence || 80) - 14)}/100`,
      comment: `Volatile review trend and lower consistency on repeat customer scores.`
    }
  ];
}

function buildProfileData(expert) {
  const investors = expert.investors && expert.investors.length ? expert.investors : buildDefaultInvestors(expert);
  const verdicts = expert.verdicts && expert.verdicts.length ? expert.verdicts : buildDefaultVerdicts(expert);
  const totalInvested = investors.reduce((sum, inv) => sum + Number(inv.amount || 0), 0);
  const boughtByUsers = expert.profileStats?.boughtByUsers ?? (70 + Number(expert.id || 1) * 4);
  const soldByUsers = expert.profileStats?.soldByUsers ?? (15 + Number(expert.id || 1));
  const monthlyReturn = expert.profileStats?.monthlyReturn ?? (expert.risk === 'Low' ? 6.4 : expert.risk === 'Medium' ? 12.4 : 18.2);

  return {
    expert: {
      id: expert.profileId || expert.name.toLowerCase().replace(/\s+/g, '.'),
      name: expert.name,
      city: expert.city,
      niche: expert.niche,
      bio: expert.bio,
      tags: expert.tags || [],
      stats: {
        investors: investors.length ? investors.reduce((sum, inv) => sum + Number(inv.units || 0), 0) : 0,
        totalInvested,
        confidence: Number(expert.confidence || 0),
        monthlyReturn,
        boughtByUsers,
        soldByUsers
      }
    },
    investors,
    verdicts
  };
}

async function loadSelectedExpert() {
  const params = new URLSearchParams(window.location.search);
  const expertId = params.get('expert');

  const stored = localStorage.getItem('selectedExpert');
  const lastSeenId = localStorage.getItem('lastSeenExpertId');

  if (stored) {
    const parsed = JSON.parse(stored);
    if (!expertId || String(parsed.id) === String(expertId)) {
      localStorage.setItem('lastSeenExpertId', String(parsed.id));
      return parsed;
    }
  }

  const response = await fetch('experts.json');
  if (!response.ok) throw new Error('Failed to load experts');

  const experts = await response.json();
  if (!Array.isArray(experts)) throw new Error('Invalid expert data');

  let found = null;

  if (expertId) {
    found = experts.find(expert => String(expert.id) === String(expertId));
  }

  if (!found && lastSeenId) {
    found = experts.find(expert => String(expert.id) === String(lastSeenId));
  }

  if (!found) {
    found = experts[0];
  }

  if (found) {
    localStorage.setItem('selectedExpert', JSON.stringify(found));
    localStorage.setItem('lastSeenExpertId', String(found.id));
  }

  return found;
}

function renderExpertProfile() {
  const data = expertProfileData.expert;
  document.getElementById('expertAvatar').textContent = data.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
  document.getElementById('expertName').textContent = data.name;
  document.getElementById('expertIdentifier').textContent = 'Expert ID: ' + data.id + ' · ' + data.city + ', UK';
  document.getElementById('expertBio').textContent = data.bio;

  document.getElementById('expertTags').innerHTML = data.tags.map(tag => '<span class="cred-pill">' + tag + '</span>').join('');

  document.getElementById('expertStats').innerHTML = [
    '<div class="card"><div class="card-title">Investors</div><div class="stat-value">' + data.stats.investors + '</div><div class="stat-change up">Active backers</div></div>',
    '<div class="card"><div class="card-title">Total Invested</div><div class="stat-value">£' + data.stats.totalInvested.toLocaleString() + '</div><div class="stat-change up">Across all units</div></div>',
    '<div class="card"><div class="card-title">Confidence Score</div><div class="stat-value up">' + data.stats.confidence + '/100</div><div class="stat-change up">Based on verdict outcomes</div></div>',
    '<div class="card"><div class="card-title">30D Performance</div><div class="stat-value up">+' + data.stats.monthlyReturn + '%</div><div class="stat-change up">Vs market +2.1%</div></div>'
  ].join('');

  document.getElementById('investorPopularity').innerHTML = [
    '<div class="card"><div class="card-title">Investor Popularity</div><div class="metric-row"><span class="text-muted">Users Bought In</span><span class="mono up">' + data.stats.boughtByUsers + '</span></div><div class="metric-row"><span class="text-muted">Users Sold/Withdrew</span><span class="mono down">' + data.stats.soldByUsers + '</span></div></div>',
    '<div class="card"><div class="card-title">Net Investor Flow</div><div class="stat-value up">+' + (data.stats.boughtByUsers - data.stats.soldByUsers) + '</div><div class="stat-change up">Current cycle</div></div>'
  ].join('');

  document.getElementById('investorsTable').innerHTML = expertProfileData.investors.map(inv => {
    return '<tr><td>' + inv.name + '</td><td class="mono">' + inv.units + '</td><td class="mono">£' + Number(inv.amount).toLocaleString() + '</td></tr>';
  }).join('');

  document.getElementById('verdictList').innerHTML = expertProfileData.verdicts.map(v => {
    const verdictClass = v.verdict === 'Avoid' ? 'down' : 'up';
    return '<div class="review-item" onclick="openReviewModal(\'' + v.restaurant.replace(/'/g, "\\'") + '\')">' +
      '<div class="expert-av a2">' + v.restaurant.slice(0, 2).toUpperCase() + '</div>' +
      '<div class="expert-info"><div class="expert-name">' + v.restaurant + '</div><div class="expert-niche">Score ' + v.score + '</div></div>' +
      '<div class="expert-price"><div class="' + verdictClass + '">' + v.verdict + '</div><div class="text-muted" style="font-size:11px;">View details</div></div>' +
      '</div>';
  }).join('');

  document.title = 'ExpertMarket — ' + data.name;
}

function openReviewModal(restaurantName) {
  activeReview = expertProfileData.verdicts.find(v => v.restaurant === restaurantName);
  if (!activeReview) return;
  document.getElementById('modalRestaurant').textContent = activeReview.restaurant;
  document.getElementById('modalVerdict').textContent = activeReview.verdict;
  document.getElementById('modalScore').textContent = activeReview.score;
  document.getElementById('modalComment').textContent = activeReview.comment;
  document.getElementById('reviewModal').classList.add('open');
}

function closeReviewModal(event) {
  if (event && event.target.id && event.target.id !== 'reviewModal') return;
  document.getElementById('reviewModal').classList.remove('open');
}

(function initPage() {
  const id = document.body.dataset.page;
  const ticker = document.getElementById('ticker');
  if (ticker) ticker.style.display = id === 'landing' ? 'none' : 'block';

  const navMap = {
    landing: 0, dashboard: 1, profile: 2, stock: 3, category: 4,
    review: 5, ai: 6, portfolio: 7, ipo: 8, trust: 9
  };
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[navMap[id]]?.classList.add('active');

  loadSelectedExpert()
    .then(expert => {
      expertProfileData = buildProfileData(expert);
      renderExpertProfile();
    })
    .catch(error => {
      console.error(error);
    });
})();

function setTab(t) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById('tab-' + t)?.classList.add('active');
}

function togglePill(el) {
  el.classList.toggle('selected');
}
</script>
</body>
</html>
